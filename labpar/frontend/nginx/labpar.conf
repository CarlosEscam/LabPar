# Servidor web de LabPar: sirve la aplicación compilada y redirige /api al servicio FastAPI.
# Para HTTPS, colóquelo detrás del proxy institucional o agregue aquí los certificados (ver README).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 2m;   # el código de un envío admite hasta 200 KB; las importaciones de laboratorios, algo más

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/labpar-seguridad.conf;
    }

    # Archivos con huella en el nombre: se pueden guardar en caché indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/labpar-seguridad.conf;
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta desconocida devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/labpar-seguridad.conf;
        try_files $uri $uri/ /index.html;
    }
}
